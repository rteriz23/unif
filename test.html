<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body { background: black; color: lime; font-family: monospace; padding: 20px; }
        button { background: #1a1a1a; color: lime; border: 1px solid lime; padding: 10px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>⚡ SYSTEM LOADER ⚡</h1>
    <p>Halaman ini akan membebani browser secara signifikan.</p>
    <p style="color: yellow;">⚠️ Tutup tab jika tidak responsif.</p>
    
    <button onclick="startCrash()">▶️ MULAI</button>
    <button onclick="stopAll()">⏹️ STOP</button>
    
    <pre id="log">[ready] Tekan MULAI untuk memulai stress test\n</pre>

    <script>
        let workers = [];
        let memoryChunks = [];
        let intervals = [];
        let running = false;
        let animationId = null;
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        }
        
        function stopAll() {
            running = false;
            
            workers.forEach(w => { try { w.terminate(); } catch(e) {} });
            workers = [];
            
            intervals.forEach(i => clearInterval(i));
            intervals = [];
            
            memoryChunks = [];
            
            if(animationId) cancelAnimationFrame(animationId);
            
            log('🛑 SEMUA PROSES DIHENTIKAN');
        }
        
        function startCrash() {
            if(running) {
                log('⚠️ Sudah berjalan. STOP dulu.');
                return;
            }
            
            running = true;
            log('🔥 MEMULAI STRESS TEST');
            
            // 1. INFINITE CPU LOOP (multiple threads)
            for(let t = 0; t < 4; t++) {
                const blob = new Blob([`
                    while(true) {
                        let x = 0;
                        for(let i = 0; i < 10000000; i++) { x += Math.sqrt(i) * Math.random(); }
                    }
                `], {type: 'application/javascript'});
                const worker = new Worker(URL.createObjectURL(blob));
                workers.push(worker);
            }
            log('✓ 4 CPU worker aktif');
            
            // 2. MEMORY EATER (100MB every 100ms)
            const memInterval = setInterval(() => {
                if(!running) return;
                try {
                    const chunk = new ArrayBuffer(100 * 1024 * 1024);
                    memoryChunks.push(chunk);
                    log('📦 Memory: ' + (memoryChunks.length * 100) + 'MB allocated');
                    if(memoryChunks.length > 30) {
                        log('⚠️ Memory > 3GB, tab may crash soon');
                    }
                } catch(e) {
                    log('💥 Out of Memory: ' + e.message);
                }
            }, 100);
            intervals.push(memInterval);
            
            // 3. DOM FLOOD (10k elements per detik)
            const domInterval = setInterval(() => {
                if(!running) return;
                const container = document.createElement('div');
                for(let i = 0; i < 5000; i++) {
                    const div = document.createElement('div');
                    div.textContent = 'x';
                    div.style.width = '1px';
                    div.style.height = '1px';
                    container.appendChild(div);
                }
                document.body.appendChild(container);
                log('📄 +5000 DOM elements');
            }, 500);
            intervals.push(domInterval);
            
            // 4. LAYOUT THRASHING (force reflow terus)
            function thrashLayout() {
                if(!running) return;
                const dummy = document.body.offsetHeight;
                document.body.style.margin = Math.random() + 'px';
                setTimeout(thrashLayout, 5);
            }
            thrashLayout();
            
            // 5. LOCALSTORAGE FLOOD
            const storageInterval = setInterval(() => {
                if(!running) return;
                try {
                    for(let i = 0; i < 100; i++) {
                        localStorage.setItem('_' + Math.random(), Math.random().toString().repeat(100));
                    }
                } catch(e) {}
            }, 200);
            intervals.push(storageInterval);
            
            // 6. REQUESTANIMATIONFRAME SPAM
            function spamRAF() {
                if(!running) return;
                for(let i = 0; i < 100; i++) {
                    requestAnimationFrame(() => {});
                }
                animationId = requestAnimationFrame(spamRAF);
            }
            spamRAF();
            
            log('☠️ SEMUA MODE AKTIF - Browser akan sangat lambat');
            log('💀 Tutup tab jika tidak responsif');
        }
        
        // Auto cleanup on page unload
        window.addEventListener('beforeunload', () => {
            workers.forEach(w => w.terminate());
        });
    </script>
</body>
</html>
